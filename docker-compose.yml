services:

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    # No healthcheck here — the amazon/dynamodb-local image is a minimal Java
    # image with no curl or wget. The dynamodb-init container handles timing
    # with a sleep instead.

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for DynamoDB Local to be ready..."
        sleep 3

        echo "Creating transactions table..."
        aws dynamodb create-table \
          --table-name ledgerlite-transactions \
          --attribute-definitions \
            AttributeName=account_id,AttributeType=S \
            AttributeName=transaction_id,AttributeType=S \
          --key-schema \
            AttributeName=account_id,KeyType=HASH \
            AttributeName=transaction_id,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000

        echo "Creating accounts table..."
        aws dynamodb create-table \
          --table-name ledgerlite-accounts \
          --attribute-definitions \
            AttributeName=account_id,AttributeType=S \
          --key-schema \
            AttributeName=account_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000

        echo "Tables created successfully."

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "8002:8000"
    environment:
      DYNAMODB_TABLE: ledgerlite-accounts
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      LOG_LEVEL: INFO
      APP_VERSION: local
      SERVICE_NAME: account-service
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8001:8000"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8000
      DYNAMODB_TABLE: ledgerlite-transactions
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      LOG_LEVEL: INFO
      APP_VERSION: local
      SERVICE_NAME: transaction-service
    depends_on:
      account-service:
        condition: service_healthy